# TaskMaster v3 — Home Assistant configuration examples

# TaskMaster fires these events (usable as automation triggers):
#   taskmaster_item_created    { item_id, board_id, board, name, created_by }
#   taskmaster_status_changed  { item_id, board_id, board, name, column, old_status, new_status, changed_by }
#   taskmaster_board_created   { board_id, name }
#   taskmaster_board_deleted   { board_id, name }
#
# It also pushes a statistics sensor: sensor.taskmaster_items
# (state = total items; attributes: done, boards)

automation:
  - alias: "TaskMaster: notify when something is Done"
    trigger:
      - platform: event
        event_type: taskmaster_status_changed
        event_data:
          new_status: Done
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "Task done 🎉"
          message: "{{ trigger.event.data.name }} on {{ trigger.event.data.board }}"

  - alias: "TaskMaster: flash light when a task gets stuck"
    trigger:
      - platform: event
        event_type: taskmaster_status_changed
        event_data:
          new_status: Stuck
    action:
      - service: light.turn_on
        target:
          entity_id: light.desk_lamp
        data:
          color_name: red

  - alias: "TaskMaster: announce new items"
    trigger:
      - platform: event
        event_type: taskmaster_item_created
    action:
      - service: notify.persistent_notification
        data:
          title: "New task"
          message: "{{ trigger.event.data.created_by }} added '{{ trigger.event.data.name }}' to {{ trigger.event.data.board }}"
